name: Sync with jrvltsql

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check-and-propose:
    name: Validate jrvltsql and propose an update PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest jrvltsql release
        id: parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/miyamamoto/jrvltsql/releases/latest --jq '.tag_name')
          PARENT_SHA=$(gh api "repos/miyamamoto/jrvltsql/commits/$LATEST" --jq '.sha')
          STORED=$(tr -d '[:space:]' < .github/jrvltsql_version.txt)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"
          echo "stored=$STORED" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST" ] && [ "$LATEST" != "$STORED" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.parent.outputs.new_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.parent.outputs.new_release == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install server and exact upstream release
        if: steps.parent.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --dev
          mkdir -p /tmp/jrvltsql-release
          gh release download "${{ steps.parent.outputs.latest }}" \
            --repo miyamamoto/jrvltsql --pattern '*.whl' \
            --dir /tmp/jrvltsql-release
          uv pip install --python .venv/bin/python /tmp/jrvltsql-release/*.whl

      - name: Build an upstream SQLite schema
        if: steps.parent.outputs.new_release == 'true'
        run: |
          mkdir -p /tmp/jrvltsql-smoke
          cd /tmp/jrvltsql-smoke
          "$GITHUB_WORKSPACE/.venv/bin/jltsql" init --force
          "$GITHUB_WORKSPACE/.venv/bin/jltsql" create-tables --db sqlite
          test -s data/keiba.db
          echo "JRVLTSQL_SCHEMA_DB=$PWD/data/keiba.db" >> "$GITHUB_ENV"

      - name: Validate generated schema and server tests
        id: tests
        if: steps.parent.outputs.new_release == 'true'
        run: |
          uv run python - <<'PY'
          import os
          from jvlink_mcp_server.database.jrvltsql_2_contract import validate_sqlite_schema

          errors = validate_sqlite_schema(os.environ["JRVLTSQL_SCHEMA_DB"])
          if errors:
              raise SystemExit("\n".join(errors))
          PY
          uv run pytest -q

      - name: Prepare update tree
        if: steps.parent.outputs.new_release == 'true'
        id: update
        env:
          PARENT_TAG: ${{ steps.parent.outputs.latest }}
          PARENT_SHA: ${{ steps.parent.outputs.commit_sha }}
        run: |
          CURRENT=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          BRANCH="chore/jrvltsql-$PARENT_TAG"
          BRANCH=${BRANCH//\//-}
          git checkout -B "$BRANCH"
          export CURRENT NEW
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          current = os.environ["CURRENT"]
          new = os.environ["NEW"]
          parent_tag = os.environ["PARENT_TAG"]
          parent_version = parent_tag.removeprefix("v")
          parent_sha = os.environ["PARENT_SHA"]

          def replace_once(path: str, pattern: str, replacement: str) -> None:
              file_path = Path(path)
              contents = file_path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, contents, count=1)
              if count != 1:
                  raise SystemExit(f"expected exactly one version surface in {path}")
              file_path.write_text(updated, encoding="utf-8")

          replace_once(
              "pyproject.toml",
              rf'(?m)^version = "{re.escape(current)}"$',
              f'version = "{new}"',
          )
          replace_once(
              "src/jvlink_mcp_server/__init__.py",
              rf'(?m)^__version__ = "{re.escape(current)}"$',
              f'__version__ = "{new}"',
          )
          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != current:
              raise SystemExit("manifest version does not match pyproject.toml")
          manifest["version"] = new
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          contract_path = "src/jvlink_mcp_server/database/jrvltsql_2_contract.py"
          replace_once(
              contract_path,
              r'(?m)^JRVLTSQL_VERSION = "[^"]+"$',
              f'JRVLTSQL_VERSION = "{parent_version}"',
          )
          replace_once(
              contract_path,
              r'(?m)^JRVLTSQL_GIT_SHA = "[0-9a-f]{40}"$',
              f'JRVLTSQL_GIT_SHA = "{parent_sha}"',
          )
          Path(".github/jrvltsql_version.txt").write_text(
              parent_tag + "\n", encoding="utf-8"
          )
          PY
          uv lock
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Validate proposed tree
        if: steps.parent.outputs.new_release == 'true'
        run: |
          uv run pytest -q
          uv build --out-dir /tmp/jvlink-mcp-proposal

      - name: Open issue on validation failure
        if: failure() && steps.parent.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "jrvltsql ${{ steps.parent.outputs.latest }} compatibility validation failed" \
            --label parent-update \
            --body "The exact upstream wheel, generated SQLite schema, or proposed MCP update failed the compatibility gate. Inspect workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

      - name: Commit and push proposal
        if: steps.parent.outputs.new_release == 'true'
        env:
          PARENT_TAG: ${{ steps.parent.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            .github/jrvltsql_version.txt \
            manifest.json \
            pyproject.toml \
            src/jvlink_mcp_server/__init__.py \
            src/jvlink_mcp_server/database/jrvltsql_2_contract.py \
            uv.lock
          git commit -m "chore: validate jrvltsql $PARENT_TAG"
          git push --force-with-lease origin "${{ steps.update.outputs.branch }}"

      - name: Open or update compatibility PR
        if: steps.parent.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.update.outputs.branch }}"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr comment "$BRANCH" --body "Revalidated against exact jrvltsql ${{ steps.parent.outputs.latest }} in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          else
            gh pr create --base master --head "$BRANCH" \
              --title "chore: support jrvltsql ${{ steps.parent.outputs.latest }}" \
              --body "Installs the exact upstream wheel, builds a fresh SQLite schema, validates all tracked primary keys, and runs the full MCP suite before proposing server v${{ steps.update.outputs.version }}. No tag or release is created before review and merge."
          fi
