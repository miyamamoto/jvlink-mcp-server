name: Sync with jrvltsql

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check-and-propose:
    name: Validate jrvltsql and propose an update PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest jrvltsql release
        id: parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/miyamamoto/jrvltsql/releases/latest --jq '.tag_name')
          STORED=$(tr -d '[:space:]' < .github/jrvltsql_version.txt)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "stored=$STORED" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST" ] && [ "$LATEST" != "$STORED" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.parent.outputs.new_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.parent.outputs.new_release == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install server and exact upstream release
        if: steps.parent.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --dev
          mkdir -p /tmp/jrvltsql-release
          gh release download "${{ steps.parent.outputs.latest }}" \
            --repo miyamamoto/jrvltsql --pattern '*.whl' \
            --dir /tmp/jrvltsql-release
          uv pip install --python .venv/bin/python /tmp/jrvltsql-release/*.whl

      - name: Build an upstream SQLite schema
        if: steps.parent.outputs.new_release == 'true'
        run: |
          mkdir -p /tmp/jrvltsql-smoke
          cd /tmp/jrvltsql-smoke
          "$GITHUB_WORKSPACE/.venv/bin/jltsql" init --force
          "$GITHUB_WORKSPACE/.venv/bin/jltsql" create-tables --db sqlite
          test -s data/keiba.db
          echo "JRVLTSQL_SCHEMA_DB=$PWD/data/keiba.db" >> "$GITHUB_ENV"

      - name: Validate generated schema and server tests
        id: tests
        if: steps.parent.outputs.new_release == 'true'
        run: |
          uv run python - <<'PY'
          import os
          from jvlink_mcp_server.database.jrvltsql_2_contract import validate_sqlite_schema

          errors = validate_sqlite_schema(os.environ["JRVLTSQL_SCHEMA_DB"])
          if errors:
              raise SystemExit("\n".join(errors))
          PY
          uv run pytest -q

      - name: Open issue on validation failure
        if: failure() && steps.parent.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "jrvltsql ${{ steps.parent.outputs.latest }} compatibility validation failed" \
            --label parent-update \
            --body "The exact upstream wheel or its generated SQLite schema failed the MCP compatibility gate. Inspect workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

      - name: Prepare update commit
        if: steps.parent.outputs.new_release == 'true'
        id: update
        run: |
          CURRENT=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          BRANCH="chore/jrvltsql-${{ steps.parent.outputs.latest }}"
          BRANCH=${BRANCH//\//-}
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
          echo "${{ steps.parent.outputs.latest }}" > .github/jrvltsql_version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add pyproject.toml .github/jrvltsql_version.txt
          git commit -m "chore: validate jrvltsql ${{ steps.parent.outputs.latest }}"
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Open or update compatibility PR
        if: steps.parent.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.update.outputs.branch }}"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr comment "$BRANCH" --body "Revalidated against exact jrvltsql ${{ steps.parent.outputs.latest }} in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          else
            gh pr create --base master --head "$BRANCH" \
              --title "chore: support jrvltsql ${{ steps.parent.outputs.latest }}" \
              --body "Installs the exact upstream wheel, builds a fresh SQLite schema, validates all tracked primary keys, and runs the full MCP suite before proposing server v${{ steps.update.outputs.version }}. No tag or release is created before review and merge."
          fi
